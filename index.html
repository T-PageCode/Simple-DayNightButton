<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>简易日月开关按钮</title>
    <style>
        body{
            background-color: rgb(199, 230, 255);
            margin: 0;
            padding: 0;
            transition: background-color 0.5s ease;
        }
        body.night{
            background-color: rgb(50,50,50);
        }
        #button{
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            background-color: rgb(85, 178, 255);
            width: 300px;
            height: 100px;
            border-radius: 800px;
            transition: background-color 0.5s ease;
        }
        #button.night{
            background-color: rgb(100,100,100);
        }
        #button.night #sun{
            left: 84%;
        }
        #sun{
            position: fixed;
            top: 50%;
            left: 16%;
            transform: translate(-50%,-50%);
            background-color: rgb(255, 196, 87);
            width: 80px;
            height: 80px;
            border-radius: 50%;
            cursor: pointer;
            transition: left 0.5s ease;
        }
    </style>
</head>
<body>
    <div id="button">
        <div id="sun"></div>
    </div>
    <script>
        let button = document.getElementById("button");
        let sun = document.getElementById("sun");
        let bg = document.body;
        sun.onclick = () => {
            button.classList.toggle("night");
            bg.classList.toggle("night");
        }
    </script>
</body>
</html>
